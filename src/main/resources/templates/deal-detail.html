<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fırsat Detayı | SalesTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body data-page="deal-detail">
<div class="app-shell">
    <aside class="sidebar" th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <header class="topbar" th:replace="~{fragments/layout :: topbar('Fırsat Detayı')}"></header>

        <div class="page-content">
            <div class="page-heading">
                <div>
                    <p class="eyebrow">FIRSAT</p>
                    <h1 id="deal-detail-title">Yükleniyor…</h1>
                    <p class="text-secondary mb-0"><a href="/deals"><i class="bi bi-arrow-left"></i> Fırsatlara dön</a></p>
                </div>
                <span id="deal-detail-stage" class="badge-status">—</span>
            </div>

            <div class="dashboard-grid">
                <section class="panel panel-elevated">
                    <div class="panel-header">
                        <div>
                            <h2>Genel bilgiler</h2>
                            <p>Fırsatın temel detayları</p>
                        </div>
                    </div>
                    <div class="report-stat-grid" style="grid-template-columns:1fr;gap:10px;">
                        <div class="d-flex justify-content-between"><span class="text-secondary">Tutar</span><strong id="deal-detail-amount">—</strong></div>
                        <div class="d-flex justify-content-between"><span class="text-secondary">Firma</span><strong id="deal-detail-company">—</strong></div>
                        <div class="d-flex justify-content-between"><span class="text-secondary">Sorumlu</span><strong id="deal-detail-assigned">—</strong></div>
                        <div class="d-flex justify-content-between"><span class="text-secondary">Tahmini kapanış</span><strong id="deal-detail-close-date">—</strong></div>
                        <div class="d-flex justify-content-between"><span class="text-secondary">Oluşturulma</span><strong id="deal-detail-created">—</strong></div>
                    </div>
                </section>

                <section class="panel panel-elevated">
                    <div class="panel-header">
                        <div>
                            <h2>Aşama geçmişi</h2>
                            <p>Fırsatın satış hunisindeki ilerleyişi</p>
                        </div>
                    </div>
                    <div id="deal-stage-history">
                        <div class="empty-state py-4">Yükleniyor…</div>
                    </div>
                </section>

                <section class="panel panel-elevated panel-wide">
                    <div class="panel-header">
                        <div>
                            <h2>Bağlı aktiviteler</h2>
                            <p>Bu fırsatla ilgili arama, toplantı, e-posta ve notlar</p>
                        </div>
                    </div>
                    <div id="deal-activity-list" class="activity-timeline">
                        <div class="empty-state py-4">Yükleniyor…</div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: toast}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
