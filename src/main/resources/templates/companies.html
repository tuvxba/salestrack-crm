<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firmalar | SalesTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body data-page="companies">
<div class="app-shell">
    <aside class="sidebar" th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <header class="topbar" th:replace="~{fragments/layout :: topbar('Firma Yönetimi')}"></header>

        <div class="page-content">
            <div class="page-heading">
                <div>
                    <p class="eyebrow">MÜŞTERİ FİRMALARI</p>
                    <h1>Firmalar</h1>
                    <p class="text-secondary mb-0">CRM'deki firma kayıtlarını yönetin.</p>
                </div>
                <button class="btn btn-primary" id="open-company-modal" data-bs-toggle="modal" data-bs-target="#companyModal">
                    <i class="bi bi-plus-lg"></i> Yeni firma
                </button>
            </div>

            <section class="panel panel-elevated">
                <div class="toolbar">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input id="company-search" type="search" placeholder="Firma adı, sektör veya web sitesi ara">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table crm-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>FİRMA</th>
                                <th>SEKTÖR</th>
                                <th>WEB SİTESİ</th>
                                <th class="text-end">İŞLEMLER</th>
                            </tr>
                        </thead>
                        <tbody id="company-table-body">
                            <tr>
                                <td colspan="4" class="text-center text-secondary py-5">Firmalar yükleniyor…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>

<div class="modal fade" id="companyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="company-form">
                <div class="modal-header">
                    <div>
                        <p class="eyebrow mb-1" id="company-modal-eyebrow">YENİ KAYIT</p>
                        <h5 class="modal-title" id="company-modal-title">Firma ekle</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="company-id">
                    <div id="company-form-alert" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label class="form-label" for="company-name">Firma adı</label>
                        <input class="form-control" id="company-name" required maxlength="160">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="company-sector">Sektör</label>
                        <input class="form-control" id="company-sector" maxlength="100" placeholder="Örn. Yazılım, Finans">
                    </div>
                    <div>
                        <label class="form-label" for="company-website">Web sitesi</label>
                        <input class="form-control" id="company-website" maxlength="255" placeholder="https://ornek.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Vazgeç</button>
                    <button type="submit" class="btn btn-primary" id="company-submit-btn">Kaydet</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: toast}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
