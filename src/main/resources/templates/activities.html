<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktiviteler | SalesTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body data-page="activities">
<div class="app-shell">
    <aside class="sidebar" th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <header class="topbar" th:replace="~{fragments/layout :: topbar('Aktivite Yönetimi')}"></header>

        <div class="page-content">
            <div class="page-heading">
                <div>
                    <p class="eyebrow">SATIŞ AKTİVİTELERİ</p>
                    <h1>Aktiviteler</h1>
                    <p class="text-secondary mb-0">Arama, toplantı, e-posta ve notları kaydedin.</p>
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newActivityModal">
                    <i class="bi bi-plus-lg"></i> Yeni aktivite
                </button>
            </div>

            <section class="panel panel-elevated">
                <div class="toolbar">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input id="activity-search" type="search" placeholder="Açıklama veya kişi/fırsat ara">
                    </div>
                    <select id="activity-type-filter" class="form-select">
                        <option value="">Tüm türler</option>
                        <option value="CALL">Arama</option>
                        <option value="EMAIL">E-posta</option>
                        <option value="MEETING">Toplantı</option>
                        <option value="NOTE">Not</option>
                    </select>
                    <select id="activity-link-filter" class="form-select">
                        <option value="">Tüm bağlantılar</option>
                        <option value="deal">Fırsat</option>
                        <option value="contact">Kişi</option>
                    </select>
                </div>

                <div id="activity-timeline" class="activity-timeline">
                    <div class="empty-state py-5">Aktiviteler yükleniyor…</div>
                </div>
            </section>
        </div>
    </main>
</div>

<div class="modal fade" id="newActivityModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <form id="new-activity-form">
                <div class="modal-header">
                    <div>
                        <p class="eyebrow mb-1">YENİ KAYIT</p>
                        <h5 class="modal-title">Aktivite ekle</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="activity-form-alert" class="alert alert-danger d-none"></div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label" for="activity-type">Tür</label>
                            <select class="form-select" id="activity-type" required>
                                <option value="CALL">Arama</option>
                                <option value="EMAIL">E-posta</option>
                                <option value="MEETING">Toplantı</option>
                                <option value="NOTE">Not</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="activity-occurred">Tarih / saat</label>
                            <input class="form-control" id="activity-occurred" type="datetime-local">
                            <small class="text-secondary">Boş bırakılırsa şu an kaydedilir.</small>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="activity-description">Açıklama</label>
                        <textarea class="form-control" id="activity-description" rows="3" required maxlength="1000" placeholder="Görüşme özeti, e-posta konusu veya not…"></textarea>
                    </div>

                    <div class="activity-link-picker">
                        <label class="form-label">Bağlantı</label>
                        <div class="link-type-tabs">
                            <label class="link-type-tab">
                                <input type="radio" name="activity-link-type" value="deal" checked>
                                <span><i class="bi bi-kanban"></i> Fırsat</span>
                            </label>
                            <label class="link-type-tab">
                                <input type="radio" name="activity-link-type" value="contact">
                                <span><i class="bi bi-person-vcard"></i> Kişi</span>
                            </label>
                        </div>
                        <div class="mt-2" id="activity-deal-wrap">
                            <select class="form-select" id="activity-deal">
                                <option value="">Fırsat seçin…</option>
                            </select>
                        </div>
                        <div class="mt-2 d-none" id="activity-contact-wrap">
                            <select class="form-select" id="activity-contact">
                                <option value="">Kişi seçin…</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Vazgeç</button>
                    <button type="submit" class="btn btn-primary">Aktiviteyi kaydet</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: toast}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
