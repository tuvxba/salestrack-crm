<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hata | SalesTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="login-page">
<main class="login-shell" style="justify-content:center;">
    <section class="login-card-wrap">
        <div class="login-card text-center">
            <i class="bi bi-signpost-2 fs-1 text-secondary mb-3 d-block"></i>
            <h2 th:text="${status} + ' - ' + ${error}">Hata</h2>
            <p class="text-secondary" th:text="${status} == 404 ? 'Aradığınız sayfa bulunamadı.' : 'Bir şeyler ters gitti, lütfen tekrar deneyin.'">Mesaj</p>
            <a href="/dashboard" class="btn btn-primary w-100 mt-3">Panele dön</a>
        </div>
    </section>
</main>
</body>
</html>
