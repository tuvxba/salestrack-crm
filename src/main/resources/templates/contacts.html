<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişiler | SalesTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body data-page="contacts">
<div class="app-shell">
    <aside class="sidebar" th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <header class="topbar" th:replace="~{fragments/layout :: topbar('Kişi Yönetimi')}"></header>

        <div class="page-content">
            <div class="page-heading">
                <div>
                    <p class="eyebrow">İLGİLİ KİŞİLER</p>
                    <h1>Kişiler</h1>
                    <p class="text-secondary mb-0">Firmalara bağlı iletişim kişilerini yönetin.</p>
                </div>
                <button class="btn btn-primary" id="open-contact-modal" data-bs-toggle="modal" data-bs-target="#contactModal">
                    <i class="bi bi-plus-lg"></i> Yeni kişi
                </button>
            </div>

            <section class="panel panel-elevated">
                <div class="toolbar">
                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input id="contact-search" type="search" placeholder="İsim, e-posta veya pozisyon ara">
                    </div>
                    <select id="contact-company-filter" class="form-select">
                        <option value="">Tüm firmalar</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table crm-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>KİŞİ</th>
                                <th>İLETİŞİM</th>
                                <th>FİRMA</th>
                                <th>POZİSYON</th>
                                <th class="text-end">İŞLEMLER</th>
                            </tr>
                        </thead>
                        <tbody id="contact-table-body">
                            <tr>
                                <td colspan="5" class="text-center text-secondary py-5">Kişiler yükleniyor…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>

<div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="contact-form">
                <div class="modal-header">
                    <div>
                        <p class="eyebrow mb-1" id="contact-modal-eyebrow">YENİ KAYIT</p>
                        <h5 class="modal-title" id="contact-modal-title">Kişi ekle</h5>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="contact-id">
                    <div id="contact-form-alert" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label class="form-label" for="contact-name">Ad soyad</label>
                        <input class="form-control" id="contact-name" required maxlength="160">
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="contact-email">E-posta</label>
                            <input class="form-control" id="contact-email" type="email" required maxlength="180">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="contact-phone">Telefon</label>
                            <input class="form-control" id="contact-phone" maxlength="40">
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label class="form-label" for="contact-position">Pozisyon</label>
                        <input class="form-control" id="contact-position" maxlength="120" placeholder="Örn. Satın Alma Müdürü">
                    </div>
                    <div>
                        <label class="form-label" for="contact-company">Firma</label>
                        <select class="form-select" id="contact-company" required>
                            <option value="">Firma seçin…</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Vazgeç</button>
                    <button type="submit" class="btn btn-primary" id="contact-submit-btn">Kaydet</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: toast}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
