<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcılar | SalesTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body data-page="admin-users">
<div class="app-shell">
    <aside class="sidebar" th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="main-content">
        <header class="topbar" th:replace="~{fragments/layout :: topbar('Kullanıcı Yönetimi')}"></header>

        <div class="page-content">
            <div class="page-heading">
                <div>
                    <p class="eyebrow">YÖNETİM</p>
                    <h1>Kullanıcılar</h1>
                    <p class="text-secondary mb-0">Kullanıcı rollerini görüntüleyin ve güncelleyin.</p>
                </div>
            </div>

            <section class="panel panel-elevated">
                <div class="table-responsive">
                    <table class="table crm-table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>AD SOYAD</th>
                                <th>E-POSTA</th>
                                <th>ROL</th>
                                <th>KAYIT TARİHİ</th>
                            </tr>
                        </thead>
                        <tbody id="admin-user-table-body">
                            <tr>
                                <td colspan="4" class="text-center text-secondary py-5">Kullanıcılar yükleniyor…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: toast}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
